name: Deploy (VPS)

# Production runs on Vercel (see DEPLOYMENT.md). This self-hosted VPS pipeline
# is kept for reference and only runs when triggered manually.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build & push API Docker image ──────────────────────────────────────
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}

  # ── 2. Build Admin SPA ─────────────────────────────────────────────────────
  build-admin:
    name: Build Admin SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install & build
        working-directory: apps/admin
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist/
          retention-days: 1

  # ── 3. Build Booking SPA ───────────────────────────────────────────────────
  build-booking:
    name: Build Booking SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/booking/package-lock.json

      - name: Install & build
        working-directory: apps/booking
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: booking-dist
          path: apps/booking/dist/
          retention-days: 1

  # ── 4. Deploy to VPS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    needs: [build-api, build-admin, build-booking]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist/

      - uses: actions/download-artifact@v4
        with:
          name: booking-dist
          path: apps/booking/dist/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/balon/

      - name: Write .env on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cat > /opt/balon/.env" <<'EOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          VERSION=${{ github.sha }}
          AUTO_MIGRATE=true
          EOF

      - name: Pull image & restart services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /opt/balon &&
            docker compose -f docker-compose.prod.yml pull api worker &&
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "
