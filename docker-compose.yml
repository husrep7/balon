services:
  postgres:
    image: postgres:16
    container_name: balon-pg
    environment:
      POSTGRES_USER: balon
      POSTGRES_PASSWORD: balon
      POSTGRES_DB: balon
    ports:
      - "5432:5432"
    volumes:
      - balon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balon -d balon"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: balon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  balon_pgdata:
